<!DOCTYPE html>
<html>
<head>
    <title>Kiwi Song Manager</title>
</head>
<body>

    <h1>🎵 Kiwi Song Manager</h1>

    <a href="{{ url_for('songs') }}">All Songs</a>
    <a href="{{ url_for('add_song') }}">Add Song</a>

    <br><br>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p>{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <table border="1" cellpadding="10" width="100%">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Artist</th>
            <th>Link</th>
        </tr>

        {% for song in songs %}
        <tr>
            <td>{{ song.id }}</td>
            <td>{{ song.name }}</td>
            <td>{{ song.artist }}</td>
            <td>
                <!-- PLAY LINK -->
                <a href="{{ song.url }}" target="_blank">Play</a>

                <!-- DELETE BUTTON -->
                <form action="{{ url_for('delete_song', song_id=song.id) }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Delete this song?');" style="margin-left:10px;">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
