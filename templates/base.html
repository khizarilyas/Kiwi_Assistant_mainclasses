<!DOCTYPE html>
<html>
<head>
    <title>Kiwi Song Manager</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f4f6f8; }
        h1 { color: #2c3e50; }
        a { text-decoration: none; color: #2980b9; margin-right: 15px; }
        table { border-collapse: collapse; width: 100%; background: white; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #2c3e50; color: white; }
        .btn { padding: 8px 12px; background: #27ae60; color: white; border-radius: 4px; border: none; }
        .flash { color: green; margin-top: 10px; }
        input { padding: 6px; width: 300px; }
    </style>
</head>
<body>

<h1>🎵 Kiwi Song Manager</h1>
<a href="{{ url_for('songs') }}">All Songs</a>
<a href="{{ url_for('add_song') }}">Add Song</a>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    {% for msg in messages %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

{% block content %}{% endblock %}

</body>
</html>
